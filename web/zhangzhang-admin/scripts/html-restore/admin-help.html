<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>LINGZANZAN - 使用說明與常見問題</title>
  <link rel="icon" href="./assets/brand-icon-192.png">
  <link rel="stylesheet" href="./assets/admin.css?v=20260819-card-price-1">
  <link rel="stylesheet" href="./assets/admin-navigation.css?v=20260817-staff-no-finance-1" data-admin-navigation-style>
  <link rel="stylesheet" href="./assets/admin-help.css?v=20260818-help-visual-1">
</head>
<body class="labels-ready">
  <script>
    var loginParams = new URLSearchParams(location.search);
    var loginKey = 'lingzanzan-v1-admin-login';
    if (loginParams.get('resetLogin') === '1') localStorage.removeItem(loginKey);
    try {
      var cachedLogin = JSON.parse(localStorage.getItem(loginKey) || '{}');
      if (cachedLogin.version === 'password-login-v2' && cachedLogin.serverSession === true && ['admin', 'staff'].indexOf(cachedLogin.role) !== -1 && cachedLogin.until && Date.now() < cachedLogin.until) {
        document.body.classList.add('is-admin-unlocked');
      }
    } catch (error) {}
  </script>
  <div class="login-gate" data-login-gate>
    <form class="login-card" data-login-form>
      <img src="./assets/brand-logo.jpg" alt="">
      <p>ADMIN LOGIN</p>
      <h1>管理者登入</h1>
      <span>請輸入管理者或員工帳號密碼，登入後可查看使用說明與常見問題。</span>
      <input data-login-account type="text" placeholder="輸入帳號" autocomplete="username">
      <input data-login-password type="password" placeholder="輸入密碼" autocomplete="current-password">
      <button type="submit">登入後台</button>
      <a class="login-home-link" href="./">回首頁</a>
    </form>
  </div>
  <div class="admin-top-actions" hidden style="display:none">
    <span class="login-identity" data-current-user hidden></span>
    <a href="./">回首頁</a>
    <button type="button" data-logout-admin>登出</button>
  </div>
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" href="./"><img src="./assets/brand-logo.jpg" alt="">LINGZANZAN</a>
      <nav>
        <a href="./admin.html">總覽</a>
        <a class="is-active" href="./admin-help.html">使用說明與常見問題</a>
      </nav>
    </aside>
    <main>
      <section class="panel admin-help-page" id="help">
        <div class="panel-head">
          <div>
            <p>STAFF GUIDE</p>
            <h2>使用說明與常見問題</h2>
            <span>左欄只負責選功能、圖示說明與步驟重點。右欄打開使用說明本文或常見問題，不必再開別頁。</span>
          </div>
        </div>
        <form class="admin-help-search" data-help-form onsubmit="return false">
          <label>關鍵字搜尋
            <input type="search" data-help-search autocomplete="off" placeholder="例如：出貨、不知道單號、條碼、取件、Ctrl+F5">
          </label>
          <div class="admin-help-modes" data-help-modes>
            <button type="button" class="is-active" data-help-mode="how">使用說明</button>
            <button type="button" data-help-mode="fix">故障排除</button>
          </div>
        </form>
        <div class="admin-help-workspace">
          <aside class="admin-help-menu" data-help-menu aria-label="分類選單"></aside>
          <div class="admin-help-detail" data-help-detail></div>
        </div>
      </section>
    </main>
  </div>
  <div class="admin-help-lightbox" data-help-lightbox hidden><img alt="說明圖放大"></div>
  <div class="toast" data-admin-toast hidden></div>
  <script src="./assets/admin.js?v=20260820-preorder-catalog-all-1" defer></script>
  <script src="./assets/admin-labels.js?v=20260718-preorder-waiting-flow-2" defer></script>
  <script src="./assets/admin-ui-rescue.js?v=20260817-help-1" defer></script>
  <script src="./assets/admin-navigation.js?v=20260819-blacklist-phone-2" defer></script>
  <script src="./assets/admin-help-data.js?v=20260819-reserved-print-1" defer></script>
  <script src="./assets/admin-help.js?v=20260818-help-visual-1" defer></script>
  <script src="./assets/image-upload-paste.js?v=20260819-image-paste-1" defer></script>
</body>
</html>
