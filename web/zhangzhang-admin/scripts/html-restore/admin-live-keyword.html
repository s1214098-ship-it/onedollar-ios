<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>LINGZANZAN - 直播關鍵字接單</title>
  <link rel="icon" href="./assets/brand-icon-192.png">
  <link rel="stylesheet" href="./assets/admin.css?v=20260819-card-price-1">
  <link rel="stylesheet" href="./assets/admin-navigation.css?v=20260817-staff-no-finance-1" data-admin-navigation-style>
  <link rel="stylesheet" href="./assets/admin-live-keyword.css?v=20260817-live-keyword-1">
</head>
<body class="labels-ready live-keyword-page">
  <script>
    var loginParams = new URLSearchParams(location.search);
    var loginKey = 'lingzanzan-v1-admin-login';
    if (loginParams.get('resetLogin') === '1') localStorage.removeItem(loginKey);
    try {
      var cachedLogin = JSON.parse(localStorage.getItem(loginKey) || '{}');
      if (cachedLogin.version === 'password-login-v2' && cachedLogin.serverSession === true && ['admin', 'staff'].indexOf(cachedLogin.role) !== -1 && cachedLogin.until && Date.now() < cachedLogin.until) document.body.classList.add('is-admin-unlocked');
    } catch (error) {}
  </script>
  <div class="login-gate" data-login-gate>
    <form class="login-card" data-login-form>
      <img src="./assets/brand-logo.jpg" alt="LINGZANZAN">
      <p>ADMIN LOGIN</p>
      <h1>管理者登入</h1>
      <span>請輸入管理者或員工帳號密碼。</span>
      <input data-login-account type="text" placeholder="帳號" autocomplete="username">
      <input data-login-password type="password" placeholder="密碼" autocomplete="current-password">
      <button type="submit">登入後台</button><a class="login-home-link" href="./">回首頁</a>
      <small data-login-hint></small>
    </form>
  </div>
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" href="./"><img src="./assets/brand-logo.jpg" alt="">LINGZANZAN</a>
      <nav>
        <a href="./admin.html">總覽</a>
        <a href="./admin-live.html">直播打單</a>
        <a href="./admin-live-keyword.html" class="is-active">直播關鍵字接單</a>
      </nav>
    </aside>
    <main class="lk-main">
      <section class="lk-head">
        <div>
          <p>LIVE KEYWORD DESK</p>
          <h1>直播關鍵字接單</h1>
          <span>Facebook／抖音同一套：客人留言「產品編號＋數量」。先開賣編號，再貼上留言，系統自動分有效、待補尺寸、問答與無效。</span>
        </div>
        <div class="lk-head-actions">
          <a class="ghost-button" href="./live-sale.html" target="_blank" rel="noopener">查看賣場空單</a>
          <a class="ghost-button" href="./admin-live.html">改去掃條碼打單</a>
          <button type="button" class="primary-button" data-lk-empty-store>開空單並掛賣場</button>
          <button type="button" class="primary-button" data-lk-new>新開一場</button>
        </div>
      </section>
      <section class="lk-layout">
        <aside class="lk-sessions" data-lk-sessions></aside>
        <section class="lk-desk" data-lk-desk>
          <p class="lk-empty">左邊選一場，或按「新開一場」。</p>
        </section>
      </section>
    </main>
  </div>
  <div class="toast" data-admin-toast hidden></div>
  <script src="./assets/admin.js?v=20260820-preorder-catalog-all-1" defer></script>
  <script src="./assets/admin-navigation.js?v=20260819-blacklist-phone-2" defer></script>
  <script src="./assets/admin-live-keyword.js?v=20260817-live-empty-1" defer></script>
  <script src="./assets/image-upload-paste.js?v=20260819-image-paste-1" defer></script>
</body>
</html>
