<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火旺後台上架總控</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="workspace">
    <main class="wrap">
      <section class="hero">
        <div class="kicker">Z:\WEB · paohui.org 控制上架</div>
        <h1>火旺後台上架總控</h1>
        <p>左邊管物件，右邊開你指定的網站。按「全部開在右邊」會在螢幕右半邊打開。</p>
        <div class="meta" id="heroMeta"></div>
      </section>

      <div class="toolbar">
        <button class="btn red" id="openAll" type="button">全部開在右邊</button>
        <button class="btn gold" id="openCore" type="button">指定網站開在右邊</button>
        <button class="btn ghost" id="copyAll" type="button">複製全部網址</button>
        <button class="btn green" id="openHubRight" type="button">右邊開 paohui.org</button>
        <button class="btn blue" id="openAdminRight" type="button">右邊開火旺後台</button>
      </div>
      <div class="log" id="openLog"></div>

      <article class="case" id="dayouCase"></article>

      <div class="section">
        <h2>上架控制看板</h2>
        <span>記入後待更新：永慶物件、同店、開發件、專任合約</span>
      </div>
      <div class="board" id="boardGrid"></div>

      <div id="portalGroups"></div>
    </main>

    <aside class="right-dock" aria-label="右邊網站視窗">
      <div class="right-head">
        <strong>右邊網站</strong>
        <span id="rightTitle">點左邊網站，這裡開啟</span>
        <button class="btn gold" id="openCurrentRightWindow" type="button">這個也開右邊視窗</button>
      </div>
      <div class="right-tabs" id="rightTabs"></div>
      <iframe id="rightFrame" title="右邊網站" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-top-navigation-by-user-activation"></iframe>
      <div class="right-fallback" id="rightFallback">多數官網會擋內嵌。已改在螢幕右半邊開視窗。</div>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
