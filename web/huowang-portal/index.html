<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火旺後台上架總控</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="kicker">Z:\WEB · paohui.org 控制上架</div>
      <h1>火旺後台上架總控</h1>
      <p>入口網站已串在總控台。桃園大有／羅丹藝術家這筆已做成完整物件資料，掛上永慶、同店、開發件、專任合約。</p>
      <div class="meta" id="heroMeta"></div>
    </section>

    <div class="toolbar">
      <button class="btn red" id="openAll" type="button">一次開啟全部網址</button>
      <button class="btn gold" id="openCore" type="button">先開你指定的 9 個網站</button>
      <button class="btn ghost" id="copyAll" type="button">複製全部網址</button>
      <a class="btn green" href="https://paohui.org/" target="_blank" rel="noopener">開總路口 paohui.org</a>
      <a class="btn blue" href="https://huowang.paohui.org/admin.html.html" target="_blank" rel="noopener">開火旺後台</a>
    </div>
    <div class="log" id="openLog"></div>

    <article class="case" id="dayouCase"></article>

    <div class="section">
      <h2>上架控制看板</h2>
      <span>記入後待更新：永慶物件、同店、開發件、專任合約</span>
    </div>
    <div class="board" id="boardGrid"></div>

    <div id="portalGroups"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
