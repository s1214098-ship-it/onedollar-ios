      ta.value=url;
      ta.setAttribute("readonly","");
      ta.style.position="fixed";
      ta.style.left="-9999px";
      ta.style.top="0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();

      ta.remove();
    };

<script>

    for(var i=0;i<imgs.length;i++){
      var src=imgs[i].getAttribute('src')||'';
      if(src && src!==currentSrc && imgs[i].dataset.bad!=='1') return src;
    }
    return '';
  }
  document.addEventListener('error',function(e){
    var img=e.target;
    if(!img || img.tagName!=='IMG') return;
    img.dataset.bad='1';
    var cls=img.className||'';
    if(String(cls).indexOf('main-img')>=0 || String(cls).indexOf('detail-main-img')>=0){
      var card=img.closest('.case-card') || img.closest('.detail-box');
      var next=candidateFrom(card,img.getAttribute('src')||'');
      if(next){ img.src=next; return; }
      img.style.display='none';
      return;
    }
    if(img.closest('.thumbs') || img.closest('.detail-thumbs')){ img.style.display='none'; return; }
    if(img.closest('.similar-card')){ var sc=img.closest('.similar-card'); if(sc) sc.style.display='none'; return; }

})();
