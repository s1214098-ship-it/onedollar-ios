name: Windows installer

on:
  push:
    branches:
      - cursor/windows-remote-peaklink-b848
      - main
    paths:
      - "PeakLink/**"
      - ".github/workflows/windows-installer.yml"
  pull_request:
    paths:
      - "PeakLink/**"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        working-directory: PeakLink
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build-windows.ps1

      - name: Upload Setup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PeakLink-Windows-Setup
          if-no-files-found: error
          path: |
            PeakLink/dist/PeakLink-Setup-1.0.0.exe
            PeakLink/dist/PeakLink-Portable-1.0.0.zip
